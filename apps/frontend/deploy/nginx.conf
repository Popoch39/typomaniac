# Serves apps/frontend/dist/ (`bun run build`), as a server block to include. The cache rules are
# those of public/_headers. brotli_static needs the ngx_brotli module; without it, remove that line
# and gzip_static serves the .gz alone.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The .br and .gz written by scripts/precompress.ts, served as they are.
  brotli_static on;
  gzip_static on;
  # What precompress.ts leaves out (files under 1 KB, a missing .br), compressed on the fly.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Named after their content by Vite: new content, new name. Not found is a 404, never the app.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The same names from one deploy to the next.
  location ~ ^/(favicons|sounds)/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Every other path is a route of the app: index.html, revalidated at each visit, as it names the
  # chunks of the latest deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
