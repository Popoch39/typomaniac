<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicons/coral.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>typomaniac</title>
    <!-- The Theme stored by src/stores/theme-store.ts (same key, same JSON), set on <html> before
         the CSS loads: the page is painted in it from the start. A former id, kept by version 1
         before the store moves it, is read as the Theme it is now; an unknown one is not set, and
         paints as Coral.
         Paper, the only light one (`scheme` in src/components/theme/themes.ts), turns the
         browser's native controls light. A known one puts its icon in the tab
         (src/components/theme/theme-favicon.ts); any other keeps Coral's, the link's own.
         Then <html lang>, the Locale the router will show (src/app-router.ts): the URL's prefix,
         else the one kept by src/stores/locale-store.ts (same key, same JSON), else the browser's
         languages (src/locale/browser-locale.ts). -->
    <script>
      try {
        const themeIds = [
          "coral",
          "lagoon",
          "matcha",
          "lilac",
          "sakura",
          "arcade",
          "chalk",
          "paper",
        ];
        const formerThemeIds = new Map([
          ["corail", "coral"],
          ["lagon", "lagoon"],
          ["matcha", "matcha"],
          ["lilas", "lilac"],
          ["sakura", "sakura"],
          ["arcade", "arcade"],
          ["craie", "chalk"],
          ["papier", "paper"],
        ]);
        const stored = JSON.parse(localStorage.getItem("typomaniac-theme"));
        let theme;

        if (stored?.version === 2) {
          theme = stored.state?.theme;
        }

        if (stored?.version === 1) {
          theme = formerThemeIds.get(stored.state?.theme);
        }

        if (themeIds.includes(theme)) {
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('link[rel="icon"]')
            ?.setAttribute("href", `/favicons/${theme}.svg`);
        }

        if (theme === "paper") {
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", "light");
        }
      } catch {}

      {
        const locales = ["fr", "en"];
        const keptLocale = () => {
          try {
            const stored = JSON.parse(localStorage.getItem("typomaniac-locale"));

            return stored?.version === 1 ? stored.state?.chosen : undefined;
          } catch {
            return undefined;
          }
        };
        const browserLocale = () => {
          const spoken = navigator.languages.find((language) => /^(fr|en)(-|$)/i.test(language));

          return spoken?.toLowerCase().startsWith("fr") ? "fr" : "en";
        };
        const prefix = location.pathname.split("/")[1];
        const kept = keptLocale();

        document.documentElement.lang = locales.includes(prefix)
          ? prefix
          : locales.includes(kept)
            ? kept
            : browserLocale();
      }
    </script>
    <!-- The ink, text and accent of each Theme (src/index.css), painted before the CSS loads: no
         flash. The text and the accent paint the Logo waiting in #root, by class: var() does not
         work in an SVG presentation attribute. -->
    <style>
      html {
        background: #15141c;
        --boot-text: #ecebf3;
        --boot-brand: #ff8a65;
      }
      html[data-theme="lagoon"] {
        background: #0d1720;
        --boot-text: #e3eef5;
        --boot-brand: #5cc8ff;
      }
      html[data-theme="matcha"] {
        background: #121611;
        --boot-text: #e9f0e3;
        --boot-brand: #b8f36b;
      }
      html[data-theme="lilac"] {
        background: #15121d;
        --boot-text: #eee9f7;
        --boot-brand: #c9a7ff;
      }
      html[data-theme="sakura"] {
        background: #1a1318;
        --boot-text: #f6e9ef;
        --boot-brand: #f7a1d0;
      }
      html[data-theme="arcade"] {
        background: #0a0a12;
        --boot-text: #f1f1ff;
        --boot-brand: #ff4fa0;
      }
      html[data-theme="chalk"] {
        background: #111111;
        --boot-text: #f0f0f0;
        --boot-brand: #f0f0f0;
      }
      html[data-theme="paper"] {
        background: #f3eee4;
        color-scheme: light;
        --boot-text: #1f1c17;
        --boot-brand: #ba431d;
      }
      .boot-logo {
        position: fixed;
        inset: 0;
        width: 84px;
        height: 84px;
        margin: auto;
      }
      .boot-logo-t {
        stroke: var(--boot-text);
      }
      .boot-logo-wave {
        stroke: var(--boot-brand);
      }
    </style>
  </head>
  <body>
    <!-- The Logo, full drawing of src/components/brand/logo-drawings.ts, still at the centre of the
         Theme's ink until React's first render replaces it. -->
    <div id="root">
      <svg
        class="boot-logo"
        viewBox="0 0 100 100"
        role="img"
        aria-label="typomaniac"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path class="boot-logo-t" d="M46 12 V50 Q46 60 56 60 H66" stroke-width="12" />
        <path class="boot-logo-t" d="M30 30 H64" stroke-width="12" />
        <path
          class="boot-logo-wave"
          d="M16 82 Q24 72 32 82 T48 82 T64 82 T80 82"
          stroke-width="7"
        />
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
