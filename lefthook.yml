pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md,yml,yaml,css,html}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: bunx oxlint --fix --max-warnings 0 {staged_files}
      stage_fixed: true

    - name: types
      glob: "*.{ts,tsx}"
      run: bun run check-types
